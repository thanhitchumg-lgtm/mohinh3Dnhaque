<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ===== Nhãn phòng: [tên, phụ đề, x, z] (mét, theo toạ độ mô hình). Sửa tại đây nếu cần. =====
const LABELS = []; // mô hình ngoại thất: không đặt nhãn phòng

const params = new URLSearchParams(location.search);
const SHOT = params.has('shot');
const MOBILE = matchMedia('(pointer:coarse)').matches || innerWidth < 800;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, logarithmicDepthBuffer: true });

document.body.appendChild(renderer.domElement);
const lblR = new CSS2DRenderer(); lblR.setSize(innerWidth, innerHeight);
lblR.domElement.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none'; document.body.appendChild(lblR.domElement);

const scene = new THREE.Scene(); scene.background = new THREE.Color(0xeef0f2);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .55;

const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.castShadow = true; scene.add(sun, sun.target);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, .05, 2000); window.__cam = camera;
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
const C = new THREE.Vector3(); let R = 10;
const views = {
  iso: () => camera.position.set(C.x - R * .9, C.y + R * 1.5, C.z + R * 1.3),
  iso2: () => camera.position.set(C.x + R * .9, C.y + R * 1.5, C.z + R * 1.3),

  camera.position.sub(C).multiplyScalar(fit).add(C);

}
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => setView(b.dataset.v));

// ===== Chỉnh màu theo yêu cầu (đổi theo tên vật liệu trong SketchUp) =====
function woodCanvas(base, vertical = false) {
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  g.fillStyle = `rgb(${base})`; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 160; i++) {
    const y = Math.random() * S, a = Math.random() * .16 + .03, f = Math.random() * .02 + .004, ph = Math.random() * 6, amp = Math.random() * 10;
    g.strokeStyle = Math.random() < .6 ? `rgba(90,55,25,${a})` : `rgba(255,245,225,${a})`; g.lineWidth = Math.random() * 2.5 + .5; g.beginPath();
    for (let x = 0; x <= S; x += 16) { const yy = y + Math.sin(x * f + ph) * amp; x ? g.lineTo(x, yy) : g.moveTo(x, yy); }
    g.stroke();
  }
  for (let i = 0; i < 1500; i++) { g.fillStyle = `rgba(80,45,20,${Math.random() * .2})`; g.fillRect(Math.random() * S, Math.random() * S, 4 + Math.random() * 14, 1); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  if (vertical) { t.center.set(.5, .5); t.rotation = Math.PI / 2; }

}
const texAnCuong = woodCanvas([224, 198, 164]);          // gỗ công nghiệp An Cường vân sồi sáng
const texSlat = woodCanvas([208, 170, 126], true);       // vách nan như ảnh v8
function brighten(t, k) {                                // làm sáng ảnh texture, giữ nguyên cách dán
  const img = t.image, c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'); g.filter = `brightness(${k}) saturate(.95)`; g.drawImage(img, 0, 0);
  const n = new THREE.CanvasTexture(c);
  for (const p of ['flipY', 'wrapS', 'wrapT', 'colorSpace', 'channel', 'rotation']) n[p] = t[p];
  n.repeat.copy(t.repeat); n.offset.copy(t.offset); n.center.copy(t.center); n.anisotropy = 8;
  return n;
}
const WORSHIP = new Set(['ARC78', '*11', '20200917215535_57147', 'Material #25742', 'Material #2523742235', 'hoa van 2', 'ho phu', 'hoa van 4',
  'hoa van ban tho 1', 'Material #063', 'hoa van 3', 'dau rong', 'yem ban tho']);
function applyOverrides(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    const m = o.material, n = m.name;
    if (n === 'default_face_material' || n === 'default_face_material255') m.color.set(0xd2cbc1);          // tường tối xuống
    else if (n === '[Wood Cherry Original]1') { m.map = texSlat; m.color.set(0xffffff); }                   // vách nan tivi
    else if (n === 'Color A04' || n === 'Material~12') { m.map = texAnCuong; m.color.set(0xffffff); m.roughness = .55; } // sofa, kệ tivi, ghế ăn
    else if (n === 'Material #-2147483510') m.color.set(0xcdc4b6);                                           // đệm sofa sáng hơn
    else if (n === 'suade') { m.map = texAnCuong; m.color.set(0xffffff); }                                   // vỏ ghế ăn
    else if (WORSHIP.has(n)) {                                                                               // phòng thờ sáng lên
      m.color.set(0xffffff);
      if (m.map) m.map = brighten(m.map, n === 'ARC78' ? 2.0 : n === '*11' || n === '20200917215535_57147' ? 1.25 : 2.3);
    }
    m.needsUpdate = true;
  });
  const p = new THREE.PointLight(0xffe2b8, 6, 6, 1.5); p.position.set(43.3, 3.3, -103.7); scene.add(p); // đèn phòng thờ
}

// ===== Chỉnh màu mô hình ngoại thất v4 (Claude 4.glb) =====
const V4 = {
  roof:  { names: ['[Roofing Shingles GAF Estates]1'], color: 0xe6ecf4 },            // ngói xanh sáng lên
  wall:  { names: ['default_face_material', 'default_face_material85', 'NAP wall white1'], color: 0xd6d3cd }, // tường nhà + tường rào tối đi
  door:  { names: ['Wood Cherry Original', 'Material10', 'Wood Board Cork'], color: 0xffffff, k: 1.8 }, // cửa gỗ sáng lên
  doorPanel: { names: ['[Color D05]1'], color: 0xd2a473, k: 1.35 },                          // mặt cánh cửa: ngả màu gỗ
  step:  { names: ['[Concrete Aggregate Smoke]1'], color: 0xffffff, k: 1.35 },               // đá bậc, hè sáng lên
  tread: { names: ['[Asphalt New]1'], color: 0xd8c8b0, k: 1.8 },                              // mặt bậc nâu sáng lên
};
function applyV4(root) {
  const done = new Set(), map = {};
  for (const r of Object.values(V4)) for (const n of r.names) map[n] = r;
  root.traverse(o => {
    if (!o.isMesh || done.has(o.material)) return;
    const m = o.material, r = map[m.name]; done.add(m);
    if (!r) return;
    m.color.set(r.color);
    if (r.k && m.map) m.map = brighten(m.map, r.k);
    m.needsUpdate = true;
  });
}

// ===== Gạch lát sân: 30×60 cm, vân đá xám đen, ron xám trắng 3 mm, lát so le nửa viên =====
const TILE_SPAN = 1.2;                                     // 1 ô ảnh = 1.2 m × 1.2 m (2 viên dài × 4 hàng)
function slateTex() {
  const S = 2048, px = S / TILE_SPAN, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  const rnd = (a, b) => a + Math.random() * (b - a);
  g.fillStyle = '#c3c7ca'; g.fillRect(0, 0, S, S);         // màu ron
  const TW = .6 * px, TH = .3 * px, J = .003 * px;          // viên 60×30, ron 3 mm
  for (let r = 0; r < 4; r++) for (let k = -1; k < 2; k++) {
    const x = k * TW + (r % 2) * TW / 2, y = r * TH;
    g.save(); g.beginPath(); g.rect(x + J / 2, y + J / 2, TW - J, TH - J); g.clip();
    const v = rnd(-7, 7); g.fillStyle = `rgb(${54 + v},${61 + v},${70 + v})`; g.fillRect(x, y, TW, TH);
    for (let i = 0; i < 900; i++) {                         // vân đá: vệt sáng tối mảnh, chạy xiên
      const a = rnd(.03, .1), l = Math.random() < .5;
      g.fillStyle = l ? `rgba(150,160,172,${a})` : `rgba(25,30,36,${a})`;
      g.beginPath(); g.ellipse(rnd(x, x + TW), rnd(y, y + TH), rnd(6, 60), rnd(1, 5), rnd(-.5, .1), 0, 7); g.fill();
    }
    for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '200,205,210' : '15,18,22'},${rnd(.04, .14)})`; g.fillRect(rnd(x, x + TW), rnd(y, y + TH), 2, 2); }
    g.restore();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 16;
  return t;
}
const mTile = new THREE.MeshStandardMaterial({ map: slateTex(), roughness: .8, metalness: 0, side: THREE.DoubleSide });
function tileMesh(tris, y) {                               // tris: mảng [x,z] ×3; UV theo toạ độ thật để mạch liền
  const pos = [], uv = [];
  for (const [x, yy, z] of tris) { pos.push(x, yy ?? y, z); uv.push(x / TILE_SPAN, -z / TILE_SPAN); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mTile); m.receiveShadow = true; return m;
}

// ===== Gạch thẻ ốp chân nhà mặt trước (dày 1 cm, phủ lên dải mặt bị chồng hình gây nháy) =====
function brickTex() { // gạch thẻ 24×6 cm, tông xám trắng lẫn nâu đỏ (giống bên nội thất), ảnh phủ 2 m ngang × 1 m cao
  const S = 1024, c = document.createElement('canvas'); c.width = 2 * S; c.height = S; const g = c.getContext('2d');
  g.fillStyle = '#5f5d5a'; g.fillRect(0, 0, 2 * S, S);                 // mạch vữa (sẫm, hợp với gạch lát sân)
  const bw = S / 4, bh = S / 16;
  for (let r = 0; r < 16; r++) for (let i = -1; i < 9; i++) {
    const x = i * bw + (r % 2 ? bw / 2 : 0), y = r * bh, t = Math.random();
    const base = t < .55 ? [122, 124, 128] : t < .8 ? [100, 102, 107] : t < .93 ? [118, 96, 88] : [140, 141, 144];   // xám sẫm ngả xanh nhẹ
    const v = Math.random() * 16 - 8;
    g.fillStyle = `rgb(${base[0] + v | 0},${base[1] + v | 0},${base[2] + v | 0})`; g.fillRect(x + 4, y + 4, bw - 8, bh - 8);
    for (let k = 0; k < 60; k++) { g.fillStyle = `rgba(${Math.random() < .5 ? '70,50,45' : '45,47,50'},${Math.random() * .35})`; g.fillRect(x + 4 + Math.random() * (bw - 10), y + 4 + Math.random() * (bh - 10), 2 + Math.random() * 6, 2 + Math.random() * 3); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 16; return t;
}
function cladding(x0, x1, y0, y1, z, th) { return cladBox(x0, x1, y0, y1, z, z + th); }   // tấm ốp mặt trước nhà
function cladBox(x0, x1, y0, y1, z0, z1) {               // tấm ốp gạch thẻ dạng hộp, UV theo mét
  const g = new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0); g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  const p = g.attributes.position, n = g.attributes.normal, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), zz = p.getZ(i);
    if (Math.abs(n.getZ(i)) > .5) uv.setXY(i, x / 2, y); else if (Math.abs(n.getX(i)) > .5) uv.setXY(i, zz / 2, y); else uv.setXY(i, x / 2, zz);
  }
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: brickTex(), roughness: .85 })); m.castShadow = m.receiveShadow = true; return m;

// ===== Lớp phòng thờ 2 + thay mặt sân trống bằng gạch =====
const LAYER = { tho2: [], tudong: [], xemay: [], maygiat: [], maiton: [] }, LAYER_OFF = { tho2: [], tudong: [], xemay: [], maygiat: [], maiton: [] };      // LAYER_OFF: vật chỉ hiện khi lớp đó tắt (nền gạch dưới phòng)
const ROOM = { x0: 31.75, x1: 36.85, z0: -85.95, z1: -80.9 }; // vùng phòng thờ 2 (m)
// tường rào bên trái (đoạn chung với phòng thờ 2): mặt ngoài A→B, mặt trong C→D
const FA = [31.723, -80.835], FB = [32.296, -85.127], FC = [31.849, -80.948];
const FN = (() => { const dx = FB[0] - FA[0], dz = FB[1] - FA[1], l = Math.hypot(dx, dz); return [-dz / l, dx / l]; })();
const fs = (x, z) => FN[0] * x + FN[1] * z, F0 = Math.min(fs(...FA), fs(...FC)) - .006, F1 = Math.max(fs(...FA), fs(...FC)) + .006;
const inFence = (x, z) => { const s = fs(x, z); return s >= F0 && s <= F1 && z >= -85.135 && z <= -80.82; };
function splitModel(root) {

  const V = new THREE.Vector3(), roomBox = new THREE.Box3(new THREE.Vector3(ROOM.x0, -1, ROOM.z0), new THREE.Vector3(ROOM.x1, 7, ROOM.z1));
  for (const o of meshes) {
    const isWall = o.material.name === 'default_face_material';
    o.geometry.computeBoundingBox();
    const wb = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld);
    if (!isWall && !wb.intersectsBox(roomBox)) continue;
    const g = o.geometry, p = g.attributes.position;
    const idx = g.index ? g.index.array : Uint32Array.from({ length: p.count }, (_, i) => i);
    const keep = [], room = [], P = [[], [], []];
    for (let t = 0; t < idx.length; t += 3) {
      for (let k = 0; k < 3; k++) { V.fromBufferAttribute(p, idx[t + k]).applyMatrix4(o.matrixWorld); P[k] = [V.x, V.y, V.z]; }
      const cx = (P[0][0] + P[1][0] + P[2][0]) / 3, cy = (P[0][1] + P[1][1] + P[2][1]) / 3, cz = (P[0][2] + P[1][2] + P[2][2]) / 3;
      const inRoom = cx > ROOM.x0 && cx < ROOM.x1 && cz > ROOM.z0 && cz < ROOM.z1 && cy < 7
        && !P.some(q => q[0] > 36.9 || q[2] < -85.96)                       // tường rào trước (dài) + phía sau
        && !(isWall && P.every(q => inFence(q[0], q[2])))                   // tường rào trái: giữ nguyên
        && !(isWall && P.every(q => q[0] < 32.46) && Math.max(P[0][1], P[1][1], P[2][1]) <= 2.73 && Math.min(P[0][2], P[1][2], P[2][2]) < -85.12
             && !P.every(q => Math.abs(q[0] - 32.396) < .003));             // trụ trang trí của tường rào sát góc phòng

  const nBrown = riserBrown(root);                                          // làm trước khi tách mặt bậc nâu đỏ ra
  dropCovered(root, [CS, 'default_face_material'], [CS1], porch);            // hè trái: mặt bậc, mặt hè dựng trùng
  liftTris(root, ['[Asphalt New]1'], porch, new THREE.Vector3(0, .003, 0)); // mặt bậc gỗ nâu đỏ nhích lên 3 mm
  dropCovered(root, ['[Color D05]1'], ['Wood Cherry Original'], [[41.4, .7, -91.4], [42.6, 3.0, -84.9]]); // 2 cánh cửa gỗ hiên trái
  liftTris(root, ['<DarkGray>1'], [[42.2, .74, -84.35], [55.2, 1.44, -84.32]], new THREE.Vector3(0, 0, .005)); // dải sơn tím chân tường
  liftTris(root, ['Material~1'], [[49.9, 3.7, -81.35], [51.3, 3.9, -79.8]], new THREE.Vector3(0, .01, 0));      // tấm che xanh trên khối bể nước
  scene.add(cladBox(40.69, 55.15, 0, .748, -92.35, -92.34));               // chân nhà mặt sau: gạch thẻ như mặt trước
  scene.add(cladBox(55.14, 55.15, 0, .748, -92.35, -84.33));               // chân nhà mặt bên phải
  stoneSkin(root, { x0: 39.4, x1: 40.75, z0: -92.4, z1: -84.36 });          // hè trái: cổ bậc, bệ hoa, mép hè
  stoneSkin(root, { x0: 45.45, x1: 46.6, z0: -84.33, z1: -81.4 });          // bậc lên hiên phải (cạnh chỗ để xe)
  return nBrown;
}

// ===== Mái tôn xanh: dải trước nhà (hiên phải) + dải hông phải; mép tường nhà cao 4.0 m, mép rào bằng đỉnh tường rào =====
function tinTex() {                                                         // tôn sóng vuông màu xanh lá, mỗi sóng 25 cm
  const W = 256, c = document.createElement('canvas'); c.width = W; c.height = 8; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, W, 0);
  gr.addColorStop(0, '#2c6b2f'); gr.addColorStop(.08, '#3f8a42'); gr.addColorStop(.16, '#2c6b2f'); gr.addColorStop(.2, '#1d4d20'); gr.addColorStop(.26, '#2f7232'); gr.addColorStop(1, '#2f7232');
  g.fillStyle = gr; g.fillRect(0, 0, W, 8);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 16; return t;
}
function addTinRoof() {
  const HY = 4.0, FY = 3.745, RIB = .25;
  const END = -88.89, fx = 55.48 + (END + 91.9) / 7.88 * 1.37;             // dải hông dừng ở mép cửa sổ phòng ngủ 3
  const H = [[42.3, -84.34], [55.14, -84.34], [55.14, END]];               // mép gắn tường nhà
  const F = [[fx, END], [56.85, -84.02], [51.28, -82.97], [51.1, -82.1], [48.28, -81.59], [42.3, -81.36]];  // mép trên tường rào
  const P = [...H.map(p => [...p, HY]), ...F.map(p => [...p, FY])];
  const tri = THREE.ShapeUtils.triangulateShape(P.map(([x, z]) => new THREE.Vector2(x, z)), []);
  const pos = [], uv = [];
  for (const t of tri) {
    const cx = t.reduce((s, i) => s + P[i][0], 0) / 3, side = cx > 55.14;     // dải hông: sóng chạy theo x, dải trước: sóng chạy theo z
    for (const i of t) { const [x, z, y] = P[i]; pos.push(x, y, z); uv.push(side ? z / RIB : x / RIB, 0); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map: tinTex(), roughness: .45, metalness: .25, side: THREE.DoubleSide }));
  m.castShadow = m.receiveShadow = true; scene.add(m); LAYER.maiton.push(m);
}

function setLayer(k, v) { LAYER[k].forEach(m => m.visible = v); LAYER_OFF[k].forEach(m => m.visible = !v); }
// ---------- Bảng ẩn / hiện lớp (thêm lớp mới: thêm vào LAYERS và LAYER) ----------
const LAYERS = [['tho2', 'Phòng thờ 2'], ['tudong', 'Tủ đông'], ['xemay', 'Xe máy'], ['maygiat', 'Máy giặt'], ['maiton', 'Mái tôn']];
function initLayers() {
  const box = document.getElementById('layers'), list = document.getElementById('lyList'), btn = document.getElementById('bLayer');
  const hide0 = (params.get('hide') || '').split(',');
  for (const [k, t] of LAYERS) {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" data-k="${k}" ${hide0.includes(k) ? '' : 'checked'}><span>${t}</span>`;
    l.querySelector('input').onchange = e => setLayer(k, e.target.checked); list.appendChild(l); if (hide0.includes(k)) setLayer(k, false);
  }
  const all = v => list.querySelectorAll('input').forEach(i => { i.checked = v; setLayer(i.dataset.k, v); });
  document.getElementById('lyAll').onclick = () => all(true); document.getElementById('lyNone').onclick = () => all(false);
  const tog = o => { box.classList.toggle('open', o); btn.classList.toggle('on', o); };
  btn.onclick = () => tog(!box.classList.contains('open')); document.getElementById('lyClose').onclick = () => tog(false);
  if (params.has('layers')) tog(true);
}

const labels = [];
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
loader.load(params.get('model') || 'model.glb', g => {
  const root = g.scene;
  root.traverse(o => {
    if (o.isMesh) {
      o.castShadow = o.receiveShadow = true;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m => { m.side = THREE.DoubleSide; if (m.map) m.map.anisotropy = 8; });
    }
  });
  applyV4(root);
  scene.add(root);
  splitModel(root);
  scene.add(cladding(39.49, 55.14, 0, .748, -84.338, .01));  // chân nhà mặt trước: từ hiên trái đến lối đi bên phải
  boxLayer(root, 'tudong', [49.6, .595, -84.36], [50.8, 1.45, -83.74],   // tủ đông dưới cửa sổ bếp
    ['default_face_material', '<DarkGray>1', 'Concrete Aggregate Smoke', 'Brick Tumbled', 'Rough Square Concrete Block']);
  addScooters();
  recolorHouse(root);
  boxLayer(root, 'maygiat', [55.1, .59, -85.0], [55.95, 1.45, -84.28],      // máy giặt ở lối đi bên phải nhà
    ['default_face_material', 'default_face_material85', 'Concrete Aggregate Smoke', 'Brick Tumbled', 'Rough Square Concrete Block']);
  boxLayer(root, 'maygiat', [55.7, .85, -84.84], [55.77, 1.2, -84.44], []);  // viền cửa máy giặt (dùng chung vật liệu tường)
  window.__skin = fixFlicker(root);
  addTinRoof();
  initLayers();
  const box = new THREE.Box3().setFromObject(root), size = box.getSize(new THREE.Vector3());
  box.getCenter(C); C.y = box.min.y; R = Math.max(size.x, size.z) * .75;
  controls.maxDistance = R * 8; controls.minDistance = .3;
  camera.near = .1; camera.far = R * 20; camera.updateProjectionMatrix();
  // mặt trời chiếu xiên, vùng bóng phủ toàn nhà
  sun.position.set(C.x - R * .8, C.y + R * 1.6, C.z + R * .6); sun.target.position.copy(C);
  Object.assign(sun.shadow.camera, { left: -R * 1.3, right: R * 1.3, top: R * 1.3, bottom: -R * 1.3, near: .1, far: R * 6 });
  sun.shadow.camera.updateProjectionMatrix();
  // nền
  const gnd = new THREE.Mesh(new THREE.PlaneGeometry(R * 12, R * 12), new THREE.MeshStandardMaterial({ color: 0xf2f1ee, roughness: 1 }));
  gnd.rotation.x = -Math.PI / 2; gnd.position.set(C.x, box.min.y - .08, C.z); gnd.receiveShadow = true; scene.add(gnd);
  for (const [t, s, x, z, y] of LABELS) {
    const d = document.createElement('div'); d.className = 'lbl'; d.innerHTML = `<b>${t}</b>${s || ''}`;
    const o = new CSS2DObject(d); o.position.set(x, y ?? box.min.y + (box.max.y - box.min.y) * .72, z); scene.add(o); labels.push(o);
  }
  if (SHOT && !params.has('labels')) labels.forEach(l => l.visible = false);
  setView(params.get('view') || 'iso');
  if (params.get('cam')) { const v = params.get('cam').split(',').map(Number); camera.position.set(v[0], v[1], v[2]); controls.target.set(v[3], v[4], v[5]); controls.update(); }
  document.getElementById('load').remove();
  window.__ready = true; window.__box = box; window.__root = root;
}, e => { if (e.total) document.getElementById('pct').textContent = Math.round(e.loaded / e.total * 100) + '%'; },
  err => { document.getElementById('load').textContent = 'Không tải được mô hình: ' + err.message + ' (hãy mở qua máy chủ web, xem HUONG-DAN.txt)'; });

(document.getElementById('bLbl')||{}).onclick = () => labels.forEach(l => l.visible = !l.visible);
document.getElementById('bShadow').onclick = () => { sun.castShadow = !sun.castShadow; };
document.getElementById('bPng').onclick = () => {
  const p0 = renderer.getPixelRatio(); renderer.setPixelRatio(MOBILE ? 2 : 3); renderer.setSize(innerWidth, innerHeight); renderer.render(scene, camera);
  const a = document.createElement('a'); a.href = renderer.domElement.toDataURL('image/png'); a.download = 'mo-hinh-3d.png'; a.click();
  renderer.setPixelRatio(p0); renderer.setSize(innerWidth, innerHeight);
};
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); lblR.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); lblR.render(scene, camera); });
</script>
