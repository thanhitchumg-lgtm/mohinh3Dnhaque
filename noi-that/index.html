// ---------- Texture thủ tục ----------
function woodCanvas({ rows = 6, base = [200, 160, 118], vary = 14, joints = true, size = 1024, grain = 46 }) {

  for (let r = 0; r < rows; r++) {

    g.fillStyle = col(); g.fillRect(0, y, Math.min(cut, size), rh);
    if (joints) { g.fillStyle = col(); g.fillRect(cut, y, size - cut, rh); }
    g.save(); g.beginPath(); g.rect(0, y, size, rh); g.clip();
    for (let i = 0; i < grain; i++) {
      const gy = y + Math.random() * rh, a = Math.random() * .2 + .05;
      g.strokeStyle = Math.random() < .55 ? `rgba(70,40,20,${a})` : `rgba(255,240,220,${a * .8})`;
      g.lineWidth = Math.random() * 2 + .4; g.beginPath();
      const f = Math.random() * .02 + .004, ph = Math.random() * 6, amp = Math.random() * rh * .07;
      for (let x = 0; x <= size; x += 16) { const yy = gy + Math.sin(x * f + ph) * amp; x ? g.lineTo(x, yy) : g.moveTo(x, yy); }
      g.stroke();
    }
    // vân núi (cathedral) + lỗ thớ gỗ
    for (let k = 0; k < (joints ? 1 : 3); k++) {
      const cx = Math.random() * size, cy = y + rh * (.3 + Math.random() * .4);
      for (let j = 1; j < 9; j++) {
        g.strokeStyle = `rgba(80,45,20,${.12 + Math.random() * .12})`; g.lineWidth = 1 + Math.random() * 1.5; g.beginPath();
        for (let t = -1; t <= 1.001; t += .05) { const xx = cx + t * j * size * .05, yy = cy + (t * t - .5) * j * rh * .09; t > -1 ? g.lineTo(xx, yy) : g.moveTo(xx, yy); }
        g.stroke();
      }
    }
    for (let i = 0; i < grain * 6; i++) {
      g.fillStyle = `rgba(60,35,15,${Math.random() * .28})`;
      g.fillRect(Math.random() * size, y + Math.random() * rh, 3 + Math.random() * 14, 1);
    }
    g.restore();
    if (joints) { g.fillStyle = 'rgba(40,25,15,.35)'; g.fillRect(0, y, size, 2); g.fillRect(cut - 1, y, 2, rh); }
  }

}
function tex(c, rx = 1, ry = 1, rot = 0) {

  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8;
  if (rot) { t.center.set(.5, .5); t.rotation = rot; }

}
function floorTileCanvas() { // 2x2 viên gạch porcelain vân đá nhẹ, có ron
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const x0 = i * S / 2, y0 = j * S / 2, v = Math.random() * 8 - 4;
    g.fillStyle = `rgb(${226 + v | 0},${216 + v | 0},${202 + v | 0})`; g.fillRect(x0, y0, S / 2, S / 2);
    for (let k = 0; k < 900; k++) { const a = Math.random() * .05; g.fillStyle = Math.random() < .5 ? `rgba(150,130,110,${a})` : `rgba(255,250,240,${a})`; g.fillRect(x0 + Math.random() * S / 2, y0 + Math.random() * S / 2, 2 + Math.random() * 6, 2 + Math.random() * 6); }
    g.save(); g.beginPath(); g.rect(x0, y0, S / 2, S / 2); g.clip();
    for (let k = 0; k < 3; k++) { g.strokeStyle = `rgba(160,140,120,${.08 + Math.random() * .08})`; g.lineWidth = 1 + Math.random() * 2; g.beginPath(); let x = x0 + Math.random() * S / 2, y = y0; g.moveTo(x, y); for (let t = 0; t < 12; t++) { x += (Math.random() - .3) * 50; y += 45; g.lineTo(x, y); } g.stroke(); }

function bambooCanvas() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 704; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 704); gr.addColorStop(0, '#f6eed9'); gr.addColorStop(1, '#e9dbb8');
  g.fillStyle = gr; g.fillRect(0, 0, 1024, 704);
  for (let i = 0; i < 6; i++) {
    const x = 110 + i * 150 + Math.random() * 40, w = 16 + Math.random() * 8;
    for (let y = 704; y > -120; y -= 105) {
      g.fillStyle = '#5d7e39'; g.fillRect(x, y - 99, w, 99);
      g.fillStyle = '#3d5a24'; g.fillRect(x - 2, y - 103, w + 4, 5);

      g.save(); const ly = Math.random() * 640 + 20, side = Math.random() < .5 ? -1 : 1;
      g.translate(x + w / 2 + side * 30, ly); g.rotate(side * (0.3 + Math.random() * .5));

}
function rugCanvas() {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#7d1f19'; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = '#d4a845'; g.lineWidth = 10; g.strokeRect(18, 18, 476, 476); g.lineWidth = 3; g.strokeRect(40, 40, 432, 432);
  g.fillStyle = '#c99a3d';
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    const cx = 74 + i * 52, cy = 74 + j * 52; g.beginPath(); g.moveTo(cx, cy - 14); g.lineTo(cx + 14, cy); g.lineTo(cx, cy + 14); g.lineTo(cx - 14, cy); g.closePath(); g.fill();
  }
  g.strokeStyle = '#e8c56a'; g.lineWidth = 6; g.beginPath(); g.arc(256, 256, 90, 0, Math.PI * 2); g.stroke();

}
function tileCanvas() {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { const v = Math.random() * 10 - 5; g.fillStyle = `rgb(${214 + v | 0},${209 + v | 0},${200 + v | 0})`; g.fillRect(i * 256, j * 256, 256, 256); }
  g.strokeStyle = '#a8a196'; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256); g.strokeRect(256, 256, 256, 256); g.strokeRect(0, 256, 256, 256); g.strokeRect(256, 0, 256, 256);

}

// ---------- Vật liệu ----------
const M = o => new THREE.MeshStandardMaterial(o);
const oakC = woodCanvas({ rows: 1, joints: false, base: [225, 190, 155] });
const mOak = M({ map: tex(oakC), roughness: .6 });
const mOakV = M({ map: tex(oakC, 1, 1, Math.PI / 2), roughness: .6 });
const mWalnut = M({ map: tex(woodCanvas({ rows: 1, joints: false, base: [128, 88, 58] })), roughness: .55 });
const mAltar = M({ map: tex(woodCanvas({ rows: 1, joints: false, base: [118, 52, 30], vary: 8 })), roughness: .35 });
const mWhiteGloss = new THREE.MeshPhysicalMaterial({ color: 0xeee8de, roughness: .14, clearcoat: 1, clearcoatRoughness: .08 });
const mWall = M({ color: 0xf1e9dd, roughness: .92 });   // tường trắng kem như ảnh mẫu
const mCap = M({ color: 0xf7f2ea, roughness: .9 });
const mDarkWood = M({ map: tex(woodCanvas({ rows: 1, joints: false, base: [92, 62, 44], vary: 8 })), roughness: .45 });
function keyRugCanvas() { // thảm be viền hoa văn chữ Vạn
  const c = document.createElement('canvas'); c.width = 512; c.height = 640; const g = c.getContext('2d');
  g.fillStyle = '#e4d6bf'; g.fillRect(0, 0, 512, 640);
  for (let i = 0; i < 5000; i++) { g.fillStyle = `rgba(150,125,95,${Math.random() * .12})`; g.fillRect(Math.random() * 512, Math.random() * 640, 2, 2); }
  g.strokeStyle = '#4b3a2c'; g.lineWidth = 6; g.strokeRect(14, 14, 484, 612); g.strokeRect(66, 66, 380, 508);
  g.lineWidth = 4;
  const key = (x, y) => { g.beginPath(); g.moveTo(x, y + 30); g.lineTo(x, y); g.lineTo(x + 30, y); g.lineTo(x + 30, y + 22); g.lineTo(x + 10, y + 22); g.lineTo(x + 10, y + 10); g.lineTo(x + 20, y + 10); g.stroke(); };
  for (let x = 24; x < 470; x += 36) { key(x, 24); key(x, 586); }
  for (let y = 60; y < 580; y += 36) { key(24, y); key(458, y); }
  return c;
}
function stoneCanvas() { // đá lát hiên ghép tấm
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  g.fillStyle = '#8f877c'; g.fillRect(0, 0, S, S);
  for (let y = 0; y < S; y += 128) {
    let x = -Math.random() * 200;
    while (x < S) {
      const w = 160 + Math.random() * 220, v = Math.random() * 26 - 13;
      g.fillStyle = `rgb(${196 + v | 0},${186 + v | 0},${170 + v | 0})`; g.fillRect(x + 3, y + 3, w - 6, 122);
      for (let k = 0; k < 160; k++) { g.fillStyle = `rgba(${Math.random() < .5 ? '120,110,95' : '235,228,215'},${Math.random() * .18})`; g.fillRect(x + Math.random() * w, y + Math.random() * 128, 3 + Math.random() * 10, 2 + Math.random() * 5); }
      x += w;
    }
  }
  return c;
}
const mDoor = M({ map: tex(woodCanvas({ rows: 1, joints: false, base: [166, 120, 80] }), 1, 1, Math.PI / 2), roughness: .55 });
const mBeige = M({ color: 0xbfa284, roughness: .97, bumpMap: null, bumpScale: 4 });
const mBeige2 = M({ color: 0xa88b6c, roughness: .97, bumpMap: null, bumpScale: 2 });
function latticeCanvas() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 1024; const g = c.getContext('2d');
  g.clearRect(0, 0, 256, 1024); g.strokeStyle = '#4a2a18'; g.lineWidth = 9;
  g.strokeRect(6, 6, 244, 1012);
  for (let y = 0; y < 1024; y += 64) for (let x = 0; x < 256; x += 64) {
    g.strokeRect(x + 14, y + 14, 36, 36); g.beginPath(); g.moveTo(x + 32, y); g.lineTo(x + 32, y + 14); g.moveTo(x, y + 32); g.lineTo(x + 14, y + 32); g.stroke();
  }
  g.fillStyle = '#4a2a18'; g.beginPath(); g.arc(128, 512, 54, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#c9a050'; g.lineWidth = 5; g.beginPath(); g.arc(128, 512, 38, 0, Math.PI * 2); g.stroke();
  return c;
}
const mLattice = M({ map: tex(latticeCanvas()), transparent: true, alphaTest: .5, side: THREE.DoubleSide, roughness: .5 });
function fabricCanvas(wrinkle) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 9000; i++) { const v = 100 + Math.random() * 60 | 0; g.fillStyle = `rgba(${v},${v},${v},.35)`; g.fillRect(Math.random() * 512, Math.random() * 512, 2, 1); }
  if (wrinkle) for (let i = 0; i < 26; i++) {
    const x0 = Math.random() * 512, y0 = Math.random() * 512, a = Math.random() * Math.PI, L = 80 + Math.random() * 200;
    const gr = g.createLinearGradient(0, -10, 0, 10); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.5, `rgba(${Math.random() < .5 ? '40,40,40' : '210,210,210'},.55)`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.save(); g.translate(x0, y0); g.rotate(a); g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, L / 2, 9 + Math.random() * 8, 0, 0, Math.PI * 2); g.fill(); g.restore();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const bumpPlain = fabricCanvas(false), bumpWrinkle = fabricCanvas(true);
const F = (color, wr = false, bs = 1.5) => M({ color, roughness: .97, bumpMap: wr ? bumpWrinkle : bumpPlain, bumpScale: bs });
const mGreyFab = F(0xb9b5b0), mGreyFab2 = F(0xa19d98);
const mWhite = F(0xf0ece6), mLinen = F(0xd9d5cf);
mBeige.bumpMap = bumpWrinkle; mBeige2.bumpMap = bumpWrinkle;
const mSofaWood = M({ map: tex(woodCanvas({ rows: 1, joints: false, base: [146, 104, 70], vary: 8 })), roughness: .45 });
const mSofaCush = F(0xb98e63, false, 1.2);
const mSofaGrey = F(0xc4c0bb, false, 1.4), mSofaGrey2 = F(0xadaaa6, false, 1.4);
const mBedGrey = F(0xb2afab, true, 2.5), mBedGrey2 = F(0x9a9792, true, 2);
mBeige.color.set(0xb7b3ae); mBeige2.color.set(0xa29e99);   // chăn ga xám như ảnh mẫu
const SOFT = new Set([mGreyFab, mGreyFab2, mWhite, mLinen, mBeige, mBeige2, mSofaCush, mSofaGrey, mSofaGrey2, mBedGrey, mBedGrey2]);
const mSage = M({ color: 0xb9c2ae, roughness: .95 });
const mTerracotta = M({ color: 0xc9967a, roughness: .95 });
const mBlueGrey = M({ color: 0xa9b6c2, roughness: .95 });
const mSteel = M({ color: 0xc9ccd0, metalness: .85, roughness: .3 });
const mSteelD = M({ color: 0x8d9196, metalness: .8, roughness: .35 });
const mBlack = M({ color: 0x17181b, roughness: .25, metalness: .2 });
const mGlass = new THREE.MeshPhysicalMaterial({ color: 0xcfe6f2, transparent: true, opacity: .3, roughness: .05 });
const mMirror = M({ color: 0xdfe8ee, metalness: 1, roughness: .05 });
const mQuartz = M({ color: 0xf1efeb, roughness: .25 });
const mGold = M({ color: 0xcfa43c, metalness: .9, roughness: .3 });
const mLeaf = M({ color: 0x4d7a37, roughness: .8 });
const mLeaf2 = M({ color: 0x5f8f3f, roughness: .8 });
const mPot = M({ color: 0xe9e4dc, roughness: .6 });
const mGroove = M({ color: 0x2b241e, roughness: 1 });
const mLED = M({ color: 0xffe2b0, emissive: 0xffc77a, emissiveIntensity: 2.2 });
const mRug = M({ color: 0xb8a68e, roughness: 1 });
const mRugRed = M({ map: tex(rugCanvas()), roughness: 1 });
const mFruit = M({ color: 0xe0782a, roughness: .6 });
const mGrass = M({ color: 0xffffff, roughness: 1 });
const mSlab = M({ color: 0xbfb6aa, roughness: .9 });
const mTile = M({ map: tex(tileCanvas(), 1, 1), roughness: .7 });

// ---------- Hàm dựng hình ----------
function bx(w, h, d, mat, x, y, z, parent = scene, shadow = true) {
  let geo;
  if (SOFT.has(mat)) geo = new RoundedBoxGeometry(w, h, d, 4, Math.min(.06, Math.min(w, h, d) * .35));
  else {
    geo = new THREE.BoxGeometry(w, h, d);
    if (mat.map) { // UV theo kích thước thật (1 tile = 1 m) để vân gỗ đúng tỉ lệ
      const uv = geo.attributes.uv, dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
      for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++) { const i = f * 4 + k; uv.setXY(i, uv.getX(i) * dims[f][0] + x * .37, uv.getY(i) * dims[f][1] + z * .53); }
    }
  }
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
function pr(x1, y1, x2, y2, y0, h, mat, shadow = true) {
  return bx(Math.abs(X(x2) - X(x1)), h, Math.abs(Z(y2) - Z(y1)), mat, (X(x1) + X(x2)) / 2, y0 + h / 2, (Z(y1) + Z(y2)) / 2, scene, shadow);
}
function cyl(r, h, mat, x, y, z, parent = scene, seg = 24, rTop = r) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, r, h, seg), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function floorRect(x1, y1, x2, y2, mat, y = 0.002) {
  const w = X(x2) - X(x1), d = Z(y2) - Z(y1);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2; m.position.set((X(x1) + X(x2)) / 2, y, (Z(y1) + Z(y2)) / 2);
  m.receiveShadow = true; scene.add(m); return m;
}
// Tường: along = 'x' (chạy ngang) hoặc 'z' (chạy dọc); t1..t2 = bề dày; s1..s2 = chiều dài; ops = lỗ cửa
function wall(along, t1, t2, s1, s2, h, ops = []) {
  const R = (a, b, y0, hh, mat = mWall, thin = false) => {
    if (b - a < .5 || hh <= .001) return;
    let T1 = t1, T2 = t2; if (thin) { const m = (t1 + t2) / 2; T1 = m - 1; T2 = m + 1; }
    along === 'x' ? pr(a, T1, b, T2, y0, hh, mat, !thin) : pr(T1, a, T2, b, y0, hh, mat, !thin);
    if (!thin && Math.abs(y0 + hh - h) < 1e-6)
      along === 'x' ? pr(a, t1, b, t2, h, .015, mCap, false) : pr(t1, a, t2, b, h, .015, mCap, false);
  };
  let cur = s1;
  for (const o of [...ops].sort((p, q) => p.a - q.a)) {
    R(cur, o.a, 0, h);
    if (o.t === 'door') { if (h > 2.2) R(o.a, o.b, 2.2, h - 2.2); }
    else if (o.t === 'open') { if (h > 2.5) R(o.a, o.b, 2.5, h - 2.5); }
    else {
      R(o.a, o.b, 0, Math.min(.9, h));

function kBase(x1, y1, x2, y2) { pr(x1, y1, x2, y2, 0, .08, mGroove); pr(x1, y1, x2, y2, .08, .78, mOak); pr(x1 - 2, y1 - 2, x2 + 2, y2 + 2, .86, .04, mQuartz); }
kBase(1147, 522, 1320, 585); kBase(1257, 585, 1320, 762);
for (let x = 1147 + 43; x < 1320; x += 43) bx(.008, .76, .01, mGroove, X(x), .47, Z(585) + .005);
for (let y = 585 + 44; y < 762; y += 44) bx(.01, .76, .008, mGroove, X(1257) - .005, .47, Z(y));
bx(X(1320) - X(1147), .008, .01, mGroove, (X(1147) + X(1320)) / 2, .66, Z(585) + .005);
pr(1288, 522, 1320, 762, 1.45, H - 1.45, mWhiteGloss);                               // tủ trên kịch trần (Acrylic)
for (let y = 522 + 40; y < 762; y += 40) bx(.01, H - 1.45, .008, mGroove, X(1288) - .005, 1.45 + (H - 1.45) / 2, Z(y));
pr(1285, 524, 1288, 760, 1.42, .015, mLED, false);                                     // LED hắt dưới tủ
pr(1167, 530, 1232, 580, .9, .008, mBlack);                                            // bếp từ
for (const [a, b] of [[1182, 541], [1217, 541], [1182, 568], [1217, 568]]) {
  const r = new THREE.Mesh(new THREE.TorusGeometry(.075, .006, 6, 32), mSteelD); r.rotation.x = Math.PI / 2; r.position.set(X(a), .91, Z(b)); scene.add(r);
}
pr(1263, 645, 1306, 730, .9, .01, mSteel); pr(1268, 652, 1301, 723, .905, .01, mSteelD);   // chậu rửa
cyl(.015, .32, mSteel, X(1312), 1.06, Z(688), scene, 10); bx(.18, .02, .02, mSteel, X(1303), 1.21, Z(688));
pr(1242, 766, 1318, 842, 0, 1.9, mSteel); bx(.006, 1.85, .01, mSteelD, X(1242) - .004, .95, Z(804));  // tủ lạnh
pr(1242, 766, 1318, 842, 1.94, H - 1.94, mWhiteGloss);
pr(1055, 778, 1168, 840, 0, .78, mOak); pr(1053, 776, 1170, 842, .78, .03, mQuartz);   // tủ phụ
cyl(.08, .25, mWhiteGloss, X(1080), .93, Z(808), scene, 16, .05);
// bàn ăn 6 ghế
pr(925, 622, 1097, 708, .72, .04, mOak);
for (const [a, b] of [[935, 630], [1087, 630], [935, 700], [1087, 700]]) pr(a - 3, b - 3, a + 3, b + 3, 0, .72, mWalnut);
for (const x of [953, 1010, 1067]) { chair(x, 610, Math.PI); chair(x, 718, 0); }
for (const x of []) {   // bỏ đèn thả (ảnh mẫu không có)
  cyl(.004, .95, mBlack, X(x), 2.42, Z(665), scene, 6);
  cyl(.14, .2, mBlack, X(x), 1.86, Z(665), scene, 24, .05);
  cyl(.13, .01, mLED, X(x), 1.755, Z(665), scene, 24).castShadow = false;
}
plantSoil(1011, 665, .76, .45); cyl(.07, .1, mWhiteGloss, X(1011), .81, Z(665), scene, 16);

// ---------- Ánh sáng ----------
scene.add(new THREE.HemisphereLight(0xffeedd, 0xa8865e, 0.75));
const C = new THREE.Vector3(X(930), 0, Z(440));
const sun = new THREE.DirectionalLight(0xffdcae, 3.6);
sun.position.set(C.x - 12, 13, C.z + 3); sun.target.position.copy(C); scene.add(sun.target); scene.add(sun);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
sun.shadow.bias = -.0003; sun.shadow.normalBias = .03; sun.shadow.radius = 4;
// đèn LED âm trần (ấm)
for (const [a, b] of [[420, 210], [780, 300], [1190, 300], [1490, 300], [520, 620], [1010, 640], [1200, 650], [1500, 700], [950, 470], [1450, 470]]) {
  const p = new THREE.PointLight(0xffc98a, 5, 7, 2); p.position.set(X(a), 2.75, Z(b)); scene.add(p);
}

// ---------- Nhãn phòng ----------
const labels = [];
function label(t, s, px, py) {
  const d = document.createElement('div'); d.className = 'lbl'; d.innerHTML = `<b>${t}</b>${s}`;
  const o = new CSS2DObject(d); o.position.set(X(px), 1.0, Z(py)); scene.add(o); labels.push(o);
}
label('PHÒNG THỜ', 'S = 11 m²', 420, 230); label('PN1', 'S = 11.7 m²', 790, 330); label('PN2', 'S = 10.6 m²', 1070, 320);
label('PN3', 'S = 10.7 m²', 1460, 330); label('PHÒNG KHÁCH', 'S = 23.6 m²', 640, 520); label('BẾP + ĂN', 'S = 13.2 m²', 1010, 780);
label('PN4', 'S = 9.0 m²', 1460, 580); label('SẢNH', '', 220, 640);
if (SHOT && !params.has('labels')) labels.forEach(l => l.visible = false);

// ---------- Camera ----------
const camera = new THREE.PerspectiveCamera(22, innerWidth / innerHeight, .1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2.1;
const views = {
  front: () => camera.position.set(C.x, 27.5, C.z + 10.5),
  side: () => camera.position.set(C.x - 17, 39, C.z + .3),
  iso: () => camera.position.set(C.x - 8, 23, C.z + 13),
  iso2: () => camera.position.set(C.x + 8, 23, C.z + 13),
  top: () => camera.position.set(C.x, 30, C.z + 3),
};
function setView(v) { views[v](); controls.target.copy(C); controls.update(); }
setView(params.get('view') || 'front');
document.getElementById('bIso').onclick = () => setView('iso');
document.getElementById('bIso2').onclick = () => setView('iso2');
document.getElementById('bTop').onclick = () => setView('top');
document.getElementById('bLbl').onclick = () => labels.forEach(l => l.visible = !l.visible);
document.getElementById('bPng').onclick = () => {
  const pr0 = renderer.getPixelRatio(); renderer.setPixelRatio(3); renderer.setSize(innerWidth, innerHeight);
  renderer.render(scene, camera);
  const a = document.createElement('a'); a.href = renderer.domElement.toDataURL('image/png'); a.download = 'phoi-canh-3d.png'; a.click();
  renderer.setPixelRatio(pr0); renderer.setSize(innerWidth, innerHeight);
};
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); lblR.setSize(innerWidth, innerHeight);
});
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
if (!params.has('noao')) { const ao = new GTAOPass(scene, camera, innerWidth, innerHeight); ao.updateGtaoMaterial({ radius: .6, distanceExponent: 1, thickness: 1, scale: 1.2 }); composer.addPass(ao); }
composer.addPass(new OutputPass());
addEventListener('resize', () => composer.setSize(innerWidth, innerHeight));
renderer.setAnimationLoop(() => { controls.update(); composer.render(); lblR.render(scene, camera); });
window.__ready = true;
</script>
