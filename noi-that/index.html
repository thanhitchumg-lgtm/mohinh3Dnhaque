<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const params = new URLSearchParams(location.search);
const SHOT = params.has('shot');
const MOBILE = matchMedia('(pointer:coarse)').matches || innerWidth < 800;
if (MOBILE) document.getElementById('hint').textContent = '1 ngón: xoay · 2 ngón: phóng to / kéo';
document.getElementById('tg').onclick = e => { const u = document.getElementById('ui'); u.classList.toggle('min'); e.target.textContent = u.classList.contains('min') ? 'Hiện thanh' : 'Ẩn thanh'; };
if (SHOT) document.getElementById('ui').style.display = 'none';

// ---- Toạ độ: 100 px trên bản vẽ = 1 m ----
const X = px => (px - 138) / 100, Z = py => (py - 10) / 100;
const H = 2.7;      // chiều cao tường (kịch trần)
const HC = 1.0;     // tường phía trước bị cắt

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 3 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.68;
document.body.appendChild(renderer.domElement);
const lblR = new CSS2DRenderer();
lblR.setSize(innerWidth, innerHeight);
lblR.domElement.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none';
document.body.appendChild(lblR.domElement);

const scene = new THREE.Scene();
// ---- Lớp: mọi vật thêm vào scene được gắn tên lớp đang mở (CUR) ----
let CUR = null;
{ const _add = scene.add.bind(scene); scene.add = (...o) => { for (const x of o) if (CUR && !x.userData.layer) x.userData.layer = CUR; return _add(...o); }; }
const inLayer = (fn, name) => function (...a) { const p = CUR; CUR = name; try { return fn.apply(this, a); } finally { CUR = p; } };
// các hàm dựng đồ (khai báo function nên dùng được từ đây) tự gắn lớp
plant = inLayer(plant, 'cay'); plantSoil = inLayer(plantSoil, 'cay'); bed = inLayer(bed, 'giuong'); wardrobe = inLayer(wardrobe, 'tuao'); chair = inLayer(chair, 'an');
scene.background = new THREE.Color(0xb9c6cf);   // nền trời xám xanh, tách khỏi tường kem
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.3;

// ---------- Texture thủ tục ----------
function woodCanvas({ rows = 6, base = [200, 160, 118], vary = 14, joints = true, size = 1024, grain = 46 }) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); const rh = size / rows;
  const col = () => { const v = (Math.random() - .5) * vary * 2; return `rgb(${base[0] + v | 0},${base[1] + v * .85 | 0},${base[2] + v * .7 | 0})`; };
  for (let r = 0; r < rows; r++) {
    const y = r * rh, cut = joints ? Math.random() * size : size + 1;
    g.fillStyle = col(); g.fillRect(0, y, Math.min(cut, size), rh);
    if (joints) { g.fillStyle = col(); g.fillRect(cut, y, size - cut, rh); }
    g.save(); g.beginPath(); g.rect(0, y, size, rh); g.clip();
    for (let i = 0; i < grain; i++) {
      const gy = y + Math.random() * rh, a = Math.random() * .2 + .05;
      g.strokeStyle = Math.random() < .55 ? `rgba(70,40,20,${a})` : `rgba(255,240,220,${a * .8})`;
      g.lineWidth = Math.random() * 2 + .4; g.beginPath();
      const f = Math.random() * .02 + .004, ph = Math.random() * 6, amp = Math.random() * rh * .07;
      for (let x = 0; x <= size; x += 16) { const yy = gy + Math.sin(x * f + ph) * amp; x ? g.lineTo(x, yy) : g.moveTo(x, yy); }
      g.stroke();
    }
    // vân núi (cathedral) + lỗ thớ gỗ
    for (let k = 0; k < (joints ? 1 : 3); k++) {
      const cx = Math.random() * size, cy = y + rh * (.3 + Math.random() * .4);
      for (let j = 1; j < 9; j++) {
        g.strokeStyle = `rgba(80,45,20,${.12 + Math.random() * .12})`; g.lineWidth = 1 + Math.random() * 1.5; g.beginPath();
        for (let t = -1; t <= 1.001; t += .05) { const xx = cx + t * j * size * .05, yy = cy + (t * t - .5) * j * rh * .09; t > -1 ? g.lineTo(xx, yy) : g.moveTo(xx, yy); }
        g.stroke();
      }
    }
    for (let i = 0; i < grain * 6; i++) {
      g.fillStyle = `rgba(60,35,15,${Math.random() * .28})`;
      g.fillRect(Math.random() * size, y + Math.random() * rh, 3 + Math.random() * 14, 1);
    }
    g.restore();
    if (joints) { g.fillStyle = 'rgba(40,25,15,.35)'; g.fillRect(0, y, size, 2); g.fillRect(cut - 1, y, 2, rh); }
  }
  return c;
}
function tex(c, rx = 1, ry = 1, rot = 0) {
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (rot) { t.center.set(.5, .5); t.rotation = rot; }
  return t;
}
function floorTileCanvas() { // 2x2 viên gạch porcelain vân đá nhẹ, có ron
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
    const x0 = i * S / 2, y0 = j * S / 2, v = Math.random() * 8 - 4;
    g.fillStyle = `rgb(${226 + v | 0},${216 + v | 0},${202 + v | 0})`; g.fillRect(x0, y0, S / 2, S / 2);
    for (let k = 0; k < 900; k++) { const a = Math.random() * .05; g.fillStyle = Math.random() < .5 ? `rgba(150,130,110,${a})` : `rgba(255,250,240,${a})`; g.fillRect(x0 + Math.random() * S / 2, y0 + Math.random() * S / 2, 2 + Math.random() * 6, 2 + Math.random() * 6); }
    g.save(); g.beginPath(); g.rect(x0, y0, S / 2, S / 2); g.clip();
    for (let k = 0; k < 3; k++) { g.strokeStyle = `rgba(160,140,120,${.08 + Math.random() * .08})`; g.lineWidth = 1 + Math.random() * 2; g.beginPath(); let x = x0 + Math.random() * S / 2, y = y0; g.moveTo(x, y); for (let t = 0; t < 12; t++) { x += (Math.random() - .3) * 50; y += 45; g.lineTo(x, y); } g.stroke(); }
    g.restore();
  }
  g.fillStyle = '#a3927c'; for (const p of [0, S / 2]) { g.fillRect(p - 3, 0, 6, S); g.fillRect(0, p - 3, S, 6); }   // mạch rõ hơn
  return c;
}
function bambooCanvas() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 704; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 704); gr.addColorStop(0, '#f6eed9'); gr.addColorStop(1, '#e9dbb8');
  g.fillStyle = gr; g.fillRect(0, 0, 1024, 704);
  for (let i = 0; i < 6; i++) {
    const x = 110 + i * 150 + Math.random() * 40, w = 16 + Math.random() * 8;
    for (let y = 704; y > -120; y -= 105) {
      g.fillStyle = '#5d7e39'; g.fillRect(x, y - 99, w, 99);
      g.fillStyle = '#3d5a24'; g.fillRect(x - 2, y - 103, w + 4, 5);
    }
    for (let k = 0; k < 22; k++) {
      g.save(); const ly = Math.random() * 640 + 20, side = Math.random() < .5 ? -1 : 1;
      g.translate(x + w / 2 + side * 30, ly); g.rotate(side * (0.3 + Math.random() * .5));
      g.fillStyle = `rgba(${50 + Math.random() * 30 | 0},${95 + Math.random() * 30 | 0},40,.9)`;
      g.beginPath(); g.ellipse(0, 0, 46, 8, 0, 0, Math.PI * 2); g.fill(); g.restore();
    }
  }
  g.fillStyle = '#b3261e'; g.fillRect(930, 600, 40, 40);
  return c;
}
function rugCanvas() {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#7d1f19'; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = '#d4a845'; g.lineWidth = 10; g.strokeRect(18, 18, 476, 476); g.lineWidth = 3; g.strokeRect(40, 40, 432, 432);
  g.fillStyle = '#c99a3d';
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    const cx = 74 + i * 52, cy = 74 + j * 52; g.beginPath(); g.moveTo(cx, cy - 14); g.lineTo(cx + 14, cy); g.lineTo(cx, cy + 14); g.lineTo(cx - 14, cy); g.closePath(); g.fill();
  }
  g.strokeStyle = '#e8c56a'; g.lineWidth = 6; g.beginPath(); g.arc(256, 256, 90, 0, Math.PI * 2); g.stroke();
  return c;
}
function tileCanvas() {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { const v = Math.random() * 10 - 5; g.fillStyle = `rgb(${214 + v | 0},${209 + v | 0},${200 + v | 0})`; g.fillRect(i * 256, j * 256, 256, 256); }
  g.strokeStyle = '#a8a196'; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256); g.strokeRect(256, 256, 256, 256); g.strokeRect(0, 256, 256, 256); g.strokeRect(256, 0, 256, 256);
  return c;
}

// ---------- Vật liệu ----------
const M = o => new THREE.MeshStandardMaterial(o);
const oakC = woodCanvas({ rows: 1, joints: false, base: [225, 190, 155] });
const mOak = M({ map: tex(oakC), roughness: .6 });
const mOakV = M({ map: tex(oakC, 1, 1, Math.PI / 2), roughness: .6 });
const mWalnut = M({ map: tex(woodCanvas({ rows: 1, joints: false, base: [128, 88, 58] })), roughness: .55 });
const mAltar = M({ map: tex(woodCanvas({ rows: 1, joints: false, base: [118, 52, 30], vary: 8 })), roughness: .35 });
const mWhiteGloss = new THREE.MeshPhysicalMaterial({ color: 0xeee8de, roughness: .14, clearcoat: 1, clearcoatRoughness: .08 });
const mWall = M({ color: 0xf1e9dd, roughness: .92 });   // tường trắng kem như ảnh mẫu
const mCap = M({ color: 0xf7f2ea, roughness: .9 });
const mDarkWood = M({ map: tex(woodCanvas({ rows: 1, joints: false, base: [92, 62, 44], vary: 8 })), roughness: .45 });
function keyRugCanvas() { // thảm be viền hoa văn chữ Vạn
  const c = document.createElement('canvas'); c.width = 512; c.height = 640; const g = c.getContext('2d');
  g.fillStyle = '#e4d6bf'; g.fillRect(0, 0, 512, 640);
  for (let i = 0; i < 5000; i++) { g.fillStyle = `rgba(150,125,95,${Math.random() * .12})`; g.fillRect(Math.random() * 512, Math.random() * 640, 2, 2); }
  g.strokeStyle = '#4b3a2c'; g.lineWidth = 6; g.strokeRect(14, 14, 484, 612); g.strokeRect(66, 66, 380, 508);
  g.lineWidth = 4;
  const key = (x, y) => { g.beginPath(); g.moveTo(x, y + 30); g.lineTo(x, y); g.lineTo(x + 30, y); g.lineTo(x + 30, y + 22); g.lineTo(x + 10, y + 22); g.lineTo(x + 10, y + 10); g.lineTo(x + 20, y + 10); g.stroke(); };
  for (let x = 24; x < 470; x += 36) { key(x, 24); key(x, 586); }
  for (let y = 60; y < 580; y += 36) { key(24, y); key(458, y); }
  return c;
}
function stoneCanvas(base = [158, 159, 161]) { // đá granite nguyên tấm, mài mờ, không ron
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  g.fillStyle = `rgb(${base[0]},${base[1]},${base[2]})`; g.fillRect(0, 0, S, S);
  for (let k = 0; k < 9; k++) { // vân mây rất nhẹ, liền mạch
    const x = Math.random() * S, y = Math.random() * S, r = 200 + Math.random() * 300;
    const gr = g.createRadialGradient(x, y, 10, x, y, r); const d = Math.random() < .5 ? '0,0,0' : '255,255,255';
    gr.addColorStop(0, `rgba(${d},.05)`); gr.addColorStop(1, `rgba(${d},0)`); g.fillStyle = gr; g.fillRect(0, 0, S, S);
  }
  for (let k = 0; k < 2600; k++) { // hạt granite cỡ vừa (giữ được khi nhìn xa), độ tương phản thấp
    const r = Math.random(), z = 2 + Math.random() * 3.5;
    g.fillStyle = r < .5 ? `rgba(70,64,58,${.04 + Math.random() * .08})` : `rgba(240,236,228,${.04 + Math.random() * .08})`;
    g.beginPath(); g.ellipse(Math.random() * S, Math.random() * S, z, z * (.6 + Math.random() * .4), Math.random() * 3, 0, Math.PI * 2); g.fill();
  }
  return c;
}
const mDoor = M({ map: tex(woodCanvas({ rows: 1, joints: false, base: [166, 120, 80] }), 1, 1, Math.PI / 2), roughness: .55 });
const mBeige = M({ color: 0xbfa284, roughness: .97, bumpMap: null, bumpScale: 4 });
const mBeige2 = M({ color: 0xa88b6c, roughness: .97, bumpMap: null, bumpScale: 2 });
function latticeCanvas() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 1024; const g = c.getContext('2d');
  g.clearRect(0, 0, 256, 1024); g.strokeStyle = '#4a2a18'; g.lineWidth = 9;
  g.strokeRect(6, 6, 244, 1012);
  for (let y = 0; y < 1024; y += 64) for (let x = 0; x < 256; x += 64) {
    g.strokeRect(x + 14, y + 14, 36, 36); g.beginPath(); g.moveTo(x + 32, y); g.lineTo(x + 32, y + 14); g.moveTo(x, y + 32); g.lineTo(x + 14, y + 32); g.stroke();
  }
  g.fillStyle = '#4a2a18'; g.beginPath(); g.arc(128, 512, 54, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#c9a050'; g.lineWidth = 5; g.beginPath(); g.arc(128, 512, 38, 0, Math.PI * 2); g.stroke();
  return c;
}
const mLattice = M({ map: tex(latticeCanvas()), transparent: true, alphaTest: .5, side: THREE.DoubleSide, roughness: .5 });
function fabricCanvas(wrinkle) {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 9000; i++) { const v = 100 + Math.random() * 60 | 0; g.fillStyle = `rgba(${v},${v},${v},.35)`; g.fillRect(Math.random() * 512, Math.random() * 512, 2, 1); }
  if (wrinkle) for (let i = 0; i < 26; i++) {
    const x0 = Math.random() * 512, y0 = Math.random() * 512, a = Math.random() * Math.PI, L = 80 + Math.random() * 200;
    const gr = g.createLinearGradient(0, -10, 0, 10); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.5, `rgba(${Math.random() < .5 ? '40,40,40' : '210,210,210'},.55)`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.save(); g.translate(x0, y0); g.rotate(a); g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, L / 2, 9 + Math.random() * 8, 0, 0, Math.PI * 2); g.fill(); g.restore();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const bumpPlain = fabricCanvas(false), bumpWrinkle = fabricCanvas(true);
const F = (color, wr = false, bs = 1.5) => M({ color, roughness: .97, bumpMap: wr ? bumpWrinkle : bumpPlain, bumpScale: bs });
const mGreyFab = F(0xb9b5b0), mGreyFab2 = F(0xa19d98);
const mWhite = F(0xf0ece6), mLinen = F(0xd9d5cf);
mBeige.bumpMap = bumpWrinkle; mBeige2.bumpMap = bumpWrinkle;
const mSofaWood = M({ map: tex(woodCanvas({ rows: 1, joints: false, base: [146, 104, 70], vary: 8 })), roughness: .45 });
const mSofaCush = F(0xb98e63, false, 1.2);
const mSofaGrey = F(0xc4c0bb, false, 1.4), mSofaGrey2 = F(0xadaaa6, false, 1.4);
const mBedGrey = F(0xb2afab, true, 2.5), mBedGrey2 = F(0x9a9792, true, 2);
mBeige.color.set(0xb7b3ae); mBeige2.color.set(0xa29e99);   // chăn ga xám như ảnh mẫu
const SOFT = new Set([mGreyFab, mGreyFab2, mWhite, mLinen, mBeige, mBeige2, mSofaCush, mSofaGrey, mSofaGrey2, mBedGrey, mBedGrey2]);
