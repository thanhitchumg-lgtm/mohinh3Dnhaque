<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mô hình 3D nhà 1 tầng</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4efe8;color:#3a3129}
  header{padding:28px 20px 8px;text-align:center}
  h1{margin:0 0 6px;font-size:24px}
  p{margin:0;color:#7a6c5d;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;max-width:980px;margin:22px auto;padding:0 16px 30px}
  a.card{display:block;background:#fff;border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 3px 14px rgba(60,40,20,.12);transition:transform .15s}
  a.card:hover{transform:translateY(-3px)}
  .card img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:#eee}
  .card div{padding:14px 16px}
  .card b{font-size:18px;display:block;margin-bottom:4px}
  .card span{font-size:13px;color:#7a6c5d}
</style>
</head>
<body>
<header>
  <h1>Mô hình 3D nhà 1 tầng</h1>
  <p>Chọn mô hình để xem · xoay, phóng to được trên điện thoại và máy tính</p>
</header>
<div class="grid">
  <a class="card" href="ngoai-that/">
    <img src="anh-ngoai-that.jpg" alt="Ngoại thất">
    <div><b>Ngoại thất</b><span>Có mái ngói, cổng, tường rào · tải khoảng 13 MB</span></div>
  </a>
  <a class="card" href="noi-that/">
    <img src="anh-noi-that.jpg" alt="Nội thất">
    <div><b>Nội thất (cắt nóc)</b><span>Bố trí các phòng, có nhãn tên phòng · tải khoảng 28 MB</span></div>
  </a>
</div>
</body>
</html>
